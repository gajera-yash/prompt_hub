name: ai_prompt_hub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1
  google_mobile_ads: ^9.0.0
  share_plus: ^13.2.0
  flutter_animate: ^4.5.2
  http: ^1.6.0
  csv: ^8.0.0
  flutter_svg: ^2.3.0
  smooth_page_indicator: ^2.0.1
  lottie: ^3.3.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/app_icon.jpg"
  min_sdk_android: 21
